<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d0a3d"/>
      <stop offset="0.5" stop-color="#2b0a4d"/>
      <stop offset="1" stop-color="#0a1f3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e879f9" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="ball" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="320" cy="160" r="230" fill="url(#glow)" filter="url(#soft)"/>

  <g transform="translate(70 60)">
    <rect x="0" y="0" width="112" height="30" rx="7" fill="#ff4d6d"/>
    <rect x="122" y="0" width="112" height="30" rx="7" fill="#ffb703"/>
    <rect x="244" y="0" width="112" height="30" rx="7" fill="#00e5ff"/>
    <rect x="366" y="0" width="112" height="30" rx="7" fill="#7aff5e"/>
    <rect x="122" y="40" width="112" height="30" rx="7" fill="#e879f9"/>
    <rect x="244" y="40" width="112" height="30" rx="7" fill="#ff4d6d"/>
    <rect x="0" y="80" width="112" height="30" rx="7" fill="#00e5ff"/>
    <rect x="244" y="80" width="112" height="30" rx="7" fill="#ffb703"/>
    <rect x="366" y="80" width="112" height="30" rx="7" fill="#7aff5e"/>
  </g>

  <g filter="url(#ball)">
    <circle cx="340" cy="208" r="14" fill="#ffffff"/>
    <circle cx="336" cy="204" r="5" fill="#e879f9"/>
  </g>

  <g>
    <rect x="240" y="300" width="160" height="22" rx="11" fill="url(#sky)" stroke="#e879f9" stroke-width="3"/>
    <rect x="240" y="300" width="160" height="22" rx="11" fill="#e879f9" opacity="0.9"/>
  </g>

  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="200" r="3"/>
    <circle cx="520" cy="180" r="3"/>
    <circle cx="420" cy="120" r="2"/>
    <circle cx="180" cy="240" r="2"/>
  </g>

  <rect x="0" y="0" width="640" height="360" fill="none" stroke="#e879f9" stroke-opacity="0.35" stroke-width="2" rx="18"/>
</svg>
