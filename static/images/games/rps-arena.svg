<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d0a1a"/>
      <stop offset="0.5" stop-color="#4d0a30"/>
      <stop offset="1" stop-color="#0a1f3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#ff4d6d" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ff4d6d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241433"/>
      <stop offset="1" stop-color="#140a24"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="320" cy="170" r="220" fill="url(#glow)" filter="url(#soft)"/>

  <g transform="translate(150 100) rotate(-6)">
    <rect width="120" height="170" rx="16" fill="url(#card)" stroke="#ff4d6d" stroke-opacity="0.85" stroke-width="3"/>
    <text x="60" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="54" fill="#ff9db8">✊</text>
    <text x="60" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#ff9db8">ROCK</text>
    <rect x="24" y="140" width="72" height="16" rx="8" fill="#ff4d6d" opacity="0.35"/>
  </g>

  <g transform="translate(260 100)">
    <rect width="120" height="170" rx="16" fill="url(#card)" stroke="#00e5ff" stroke-opacity="0.85" stroke-width="3"/>
    <text x="60" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="54" fill="#9deeff">✋</text>
    <text x="60" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#9deeff">PAPER</text>
    <rect x="24" y="140" width="72" height="16" rx="8" fill="#00e5ff" opacity="0.35"/>
  </g>

  <g transform="translate(370 100) rotate(6)">
    <rect width="120" height="170" rx="16" fill="url(#card)" stroke="#ffd94d" stroke-opacity="0.85" stroke-width="3"/>
    <text x="60" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="54" fill="#ffe9a3">✌️</text>
    <text x="60" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffe9a3">SCISSORS</text>
    <rect x="24" y="140" width="72" height="16" rx="8" fill="#ffd94d" opacity="0.35"/>
  </g>

  <g transform="translate(535 150)">
    <circle cx="0" cy="0" r="34" fill="#241433" stroke="#ff4d6d" stroke-width="3"/>
    <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#ff9db8">VS</text>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="320" y="330" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffb3c4">Choose in secret. Defeat your rival!</text>
  </g>

  <g fill="#ffffff" opacity="0.55">
    <circle cx="70" cy="70" r="2.5"/><circle cx="120" cy="40" r="2"/>
    <circle cx="580" cy="60" r="2.5"/><circle cx="600" cy="110" r="2"/>
  </g>

  <rect x="0" y="0" width="640" height="360" fill="none" stroke="#ff4d6d" stroke-opacity="0.35" stroke-width="2" rx="18"/>
</svg>
