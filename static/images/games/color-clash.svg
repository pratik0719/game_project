<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b0a4d"/>
      <stop offset="0.5" stop-color="#3d0a3d"/>
      <stop offset="1" stop-color="#0a2b3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241433"/>
      <stop offset="1" stop-color="#140a24"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="320" cy="170" r="220" fill="url(#glow)" filter="url(#soft)"/>

  <g transform="translate(180 120)">
    <g transform="rotate(-18)">
      <rect x="0" y="0" width="110" height="160" rx="14" fill="url(#card)" stroke="#ff4d6d" stroke-opacity="0.85" stroke-width="3"/>
      <circle cx="55" cy="70" r="26" fill="#ff4d6d"/>
      <text x="55" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#ff9db8">7</text>
    </g>
    <g transform="rotate(-6)">
      <rect x="0" y="0" width="110" height="160" rx="14" fill="url(#card)" stroke="#00e5ff" stroke-opacity="0.85" stroke-width="3"/>
      <rect x="30" y="44" width="50" height="50" rx="10" fill="#00e5ff"/>
      <text x="55" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#9deeff">9</text>
    </g>
    <g transform="rotate(6)">
      <rect x="0" y="0" width="110" height="160" rx="14" fill="url(#card)" stroke="#ffd94d" stroke-opacity="0.85" stroke-width="3"/>
      <path d="M 55 40 L 64 58 L 84 58 L 68 70 L 74 88 L 55 76 L 36 88 L 42 70 L 26 58 L 46 58 Z" fill="#ffd94d"/>
      <text x="55" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffe9a3">3</text>
    </g>
    <g transform="rotate(18)">
      <rect x="0" y="0" width="110" height="160" rx="14" fill="url(#card)" stroke="#7aff5e" stroke-opacity="0.85" stroke-width="3"/>
      <circle cx="55" cy="70" r="26" fill="#7aff5e"/>
      <text x="55" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#c2ffb4">5</text>
    </g>
  </g>

  <g transform="translate(470 140)">
    <circle cx="0" cy="0" r="36" fill="#241433" stroke="#c084fc" stroke-width="3"/>
    <path d="M -12 -12 L 12 -12 L 12 4 L 0 16 L -12 4 Z" fill="#c084fc"/>
    <text x="0" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#d9b8ff">+50</text>
  </g>

  <g fill="#ffffff" opacity="0.55">
    <circle cx="70" cy="70" r="2.5"/><circle cx="120" cy="40" r="2"/>
    <circle cx="580" cy="60" r="2.5"/><circle cx="600" cy="110" r="2"/>
  </g>

  <rect x="0" y="0" width="640" height="360" fill="none" stroke="#c084fc" stroke-opacity="0.35" stroke-width="2" rx="18"/>
</svg>
