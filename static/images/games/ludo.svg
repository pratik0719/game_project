<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d1a08"/>
      <stop offset="0.5" stop-color="#3d1030"/>
      <stop offset="1" stop-color="#0a2b3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#ff6b35" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="320" cy="170" r="220" fill="url(#glow)" filter="url(#soft)"/>

  <g transform="translate(204 30)">
    <rect width="232" height="232" rx="22" fill="#1c1226" stroke="#ff6b35" stroke-opacity="0.55" stroke-width="3"/>
    <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="2">
      <line x1="60" y1="60" x2="172" y2="60"/>
      <line x1="60" y1="116" x2="172" y2="116"/>
      <line x1="60" y1="60" x2="60" y2="172"/>
      <line x1="116" y1="60" x2="116" y2="172"/>
      <line x1="172" y1="60" x2="172" y2="172"/>
    </g>
    <rect x="60" y="60" width="56" height="56" rx="10" fill="#ff4d6d" opacity="0.85"/>
    <rect x="116" y="60" width="56" height="56" rx="10" fill="#ffd94d" opacity="0.85"/>
    <rect x="60" y="116" width="56" height="56" rx="10" fill="#00e5ff" opacity="0.85"/>
    <rect x="116" y="116" width="56" height="56" rx="10" fill="#7aff5e" opacity="0.85"/>
    <circle cx="88" cy="88" r="17" fill="#ffffff" opacity="0.92"/>
    <circle cx="144" cy="88" r="17" fill="#ffffff" opacity="0.92"/>
    <circle cx="88" cy="144" r="17" fill="#ffffff" opacity="0.92"/>
    <circle cx="144" cy="144" r="17" fill="#ffffff" opacity="0.92"/>
    <circle cx="116" cy="116" r="17" fill="#ffffff" opacity="0.95"/>
    <circle cx="116" cy="116" r="8" fill="#ff4d6d"/>
    <circle cx="96" cy="60" r="5" fill="#ffffff" opacity="0.6"/>
    <circle cx="136" cy="96" r="5" fill="#ffffff" opacity="0.6"/>
    <circle cx="76" cy="136" r="5" fill="#ffffff" opacity="0.6"/>
  </g>

  <g transform="translate(474 46) rotate(14)">
    <rect x="0" y="0" width="74" height="74" rx="14" fill="#ffffff"/>
    <g fill="#2a1a10">
      <circle cx="37" cy="20" r="12"/>
      <circle cx="18" cy="44" r="10"/>
      <circle cx="56" cy="44" r="10"/>
      <circle cx="12" cy="60" r="7"/>
      <circle cx="37" cy="60" r="7"/>
      <circle cx="62" cy="60" r="7"/>
    </g>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="320" y="318" text-anchor="middle" font-size="24" font-weight="bold" fill="#ff9d70">Roll for 2-4 players!</text>
  </g>

  <g fill="#ffffff" opacity="0.55">
    <circle cx="70" cy="60" r="2.5"/><circle cx="590" cy="90" r="2.5"/>
    <circle cx="110" cy="320" r="2"/><circle cx="560" cy="300" r="2"/>
  </g>

  <rect x="0" y="0" width="640" height="360" fill="none" stroke="#ff6b35" stroke-opacity="0.35" stroke-width="2" rx="18"/>
</svg>
