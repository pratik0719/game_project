<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2b45"/>
      <stop offset="0.5" stop-color="#0d1f3d"/>
      <stop offset="1" stop-color="#0a1a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="hit" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="320" cy="170" r="220" fill="url(#glow)" filter="url(#soft)"/>

  <g transform="translate(160 44)">
    <rect x="-10" y="-10" width="300" height="300" rx="18" fill="#0c1830" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="3"/>
    <g stroke="#38bdf8" stroke-opacity="0.22" stroke-width="2">
      <line x1="0" y1="40" x2="280" y2="40"/><line x1="0" y1="80" x2="280" y2="80"/>
      <line x1="0" y1="120" x2="280" y2="120"/><line x1="0" y1="160" x2="280" y2="160"/>
      <line x1="0" y1="200" x2="280" y2="200"/><line x1="0" y1="240" x2="280" y2="240"/>
      <line x1="40" y1="0" x2="40" y2="280"/><line x1="80" y1="0" x2="80" y2="280"/>
      <line x1="120" y1="0" x2="120" y2="280"/><line x1="160" y1="0" x2="160" y2="280"/>
      <line x1="200" y1="0" x2="200" y2="280"/><line x1="240" y1="0" x2="240" y2="280"/>
    </g>
    <g fill="#1a4d73" stroke="#38bdf8" stroke-opacity="0.9" stroke-width="2.5" filter="url(#hit)">
      <rect x="2" y="82" width="76" height="36" rx="7"/>
      <rect x="82" y="82" width="76" height="36" rx="7"/>
      <rect x="82" y="2" width="36" height="76" rx="7"/>
      <rect x="242" y="122" width="36" height="76" rx="7"/>
    </g>
    <g filter="url(#hit)">
      <circle cx="120" cy="100" r="13" fill="#ff4d6d"/>
      <path d="M 113 93 L 127 107 M 127 93 L 113 107" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <circle cx="260" cy="160" r="13" fill="#ff4d6d"/>
      <path d="M 253 153 L 267 167 M 267 153 L 253 167" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <circle cx="40" cy="40" r="13" fill="#ff4d6d"/>
      <path d="M 33 33 L 47 47 M 47 33 L 33 47" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    </g>
    <circle cx="40" cy="40" r="22" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2"/>
    <circle cx="260" cy="160" r="22" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2"/>
  </g>

  <g transform="translate(512 120)">
    <g stroke="#ff4d6d" stroke-width="4">
      <line x1="-34" y1="0" x2="34" y2="0"/>
      <line x1="0" y1="-34" x2="0" y2="34"/>
    </g>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#ff4d6d" stroke-width="4"/>
    <circle cx="0" cy="0" r="4" fill="#ff4d6d"/>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="320" y="338" text-anchor="middle" font-size="21" font-weight="bold" fill="#9dccff">Sink the enemy fleet!</text>
  </g>

  <g fill="#ffffff" opacity="0.55">
    <circle cx="70" cy="70" r="2.5"/><circle cx="120" cy="40" r="2"/>
    <circle cx="580" cy="60" r="2.5"/><circle cx="600" cy="110" r="2"/>
  </g>

  <rect x="0" y="0" width="640" height="360" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2" rx="18"/>
</svg>
