<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b3a63"/>
      <stop offset="0.55" stop-color="#0d5a73"/>
      <stop offset="1" stop-color="#0a2b45"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37d367"/>
      <stop offset="1" stop-color="#1c9e4a"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>

  <g fill="#ffffff" opacity="0.5">
    <circle cx="90" cy="60" r="2.5"/><circle cx="140" cy="90" r="2"/>
    <circle cx="560" cy="70" r="2.5"/><circle cx="600" cy="140" r="2"/>
    <circle cx="380" cy="50" r="2"/>
  </g>

  <g>
    <rect x="150" y="0" width="64" height="120" rx="8" fill="url(#pipe)" stroke="#0a5c2c" stroke-width="4"/>
    <rect x="150" y="96" width="64" height="26" rx="6" fill="#2ec463"/>
    <rect x="150" y="228" width="64" height="132" rx="8" fill="url(#pipe)" stroke="#0a5c2c" stroke-width="4"/>
    <rect x="150" y="228" width="64" height="26" rx="6" fill="#2ec463"/>

    <rect x="300" y="0" width="58" height="180" rx="8" fill="url(#pipe)" stroke="#0a5c2c" stroke-width="4"/>
    <rect x="300" y="156" width="58" height="26" rx="6" fill="#2ec463"/>
    <rect x="300" y="248" width="58" height="112" rx="8" fill="url(#pipe)" stroke="#0a5c2c" stroke-width="4"/>
    <rect x="300" y="248" width="58" height="26" rx="6" fill="#2ec463"/>

    <rect x="470" y="0" width="70" height="90" rx="8" fill="url(#pipe)" stroke="#0a5c2c" stroke-width="4"/>
    <rect x="470" y="66" width="70" height="26" rx="6" fill="#2ec463"/>
    <rect x="470" y="260" width="70" height="100" rx="8" fill="url(#pipe)" stroke="#0a5c2c" stroke-width="4"/>
    <rect x="470" y="260" width="70" height="26" rx="6" fill="#2ec463"/>
  </g>

  <g transform="translate(220 150)">
    <g transform="rotate(-6)">
      <ellipse cx="0" cy="0" rx="36" ry="28" fill="#ffd94d"/>
      <circle cx="24" cy="-14" r="17" fill="#ffffff"/>
      <circle cx="29" cy="-10" r="3.5" fill="#0a1a10"/>
      <circle cx="31" cy="-12" r="1.6" fill="#ffffff"/>
      <path d="M 12 -20 L 16 -34 L 24 -22 Z" fill="#fb923c"/>
      <path d="M 30 6 Q 44 8 40 20" stroke="#ff9d3c" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
    <path d="M -16 20 L -30 34 M -16 20 L -2 34" stroke="#ff9d3c" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="90" y="330" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff" opacity="0.92">0</text>
  </g>

  <rect x="0" y="0" width="640" height="360" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2" rx="18"/>
</svg>
