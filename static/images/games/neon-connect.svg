<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2b45"/>
      <stop offset="0.5" stop-color="#0a1f3d"/>
      <stop offset="1" stop-color="#140a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="disc" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="320" cy="170" r="220" fill="url(#glow)" filter="url(#soft)"/>

  <g transform="translate(120 60)">
    <rect width="400" height="250" rx="18" fill="#0c1830" stroke="#00e5ff" stroke-opacity="0.65" stroke-width="4"/>
    <rect x="10" y="10" width="380" height="12" rx="6" fill="#00e5ff" opacity="0.55"/>
    <g>
      <g filter="url(#disc)">
        <circle cx="38" cy="76" r="23" fill="#ff4d9d"/>
        <circle cx="38" cy="76" r="8" fill="#ff9dc0"/>
