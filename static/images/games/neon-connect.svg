        <circle cx="236" cy="76" r="8" fill="#9deeff"/>
        <circle cx="302" cy="76" r="23" fill="#ff4d9d"/>
        <circle cx="302" cy="76" r="8" fill="#ff9dc0"/>
        <circle cx="368" cy="76" r="23" fill="#00e5ff"/>
        <circle cx="368" cy="76" r="8" fill="#9deeff"/>
      </g>
      <g filter="url(#disc)">
        <circle cx="38" cy="142" r="23" fill="#00e5ff"/>
        <circle cx="38" cy="142" r="8" fill="#9deeff"/>
        <circle cx="104" cy="142" r="23" fill="#ff4d9d"/>
        <circle cx="104" cy="142" r="8" fill="#ff9dc0"/>
        <circle cx="170" cy="142" r="23" fill="#00e5ff"/>
        <circle cx="170" cy="142" r="8" fill="#9deeff"/>
        <circle cx="236" cy="142" r="23" fill="#ff4d9d"/>
        <circle cx="236" cy="142" r="8" fill="#ff9dc0"/>
        <circle cx="302" cy="142" r="23" fill="#00e5ff"/>
        <circle cx="302" cy="142" r="8" fill="#9deeff"/>
        <circle cx="368" cy="142" r="23" fill="#ff4d9d"/>
        <circle cx="368" cy="142" r="8" fill="#ff9dc0"/>
      </g>
      <g filter="url(#disc)">
        <circle cx="38" cy="208" r="23" fill="#ff4d9d"/>
        <circle cx="38" cy="208" r="8" fill="#ff9dc0"/>
        <circle cx="104" cy="208" r="23" fill="#00e5ff"/>
        <circle cx="104" cy="208" r="8" fill="#9deeff"/>
        <circle cx="170" cy="208" r="23" fill="#ff4d9d"/>
        <circle cx="170" cy="208" r="8" fill="#ff9dc0"/>
        <circle cx="236" cy="208" r="23" fill="#ff4d9d"/>
        <circle cx="236" cy="208" r="8" fill="#ff9dc0"/>
