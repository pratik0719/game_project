<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2b45"/>
      <stop offset="0.5" stop-color="#0d1f4d"/>
      <stop offset="1" stop-color="#2b0a4d"/>
