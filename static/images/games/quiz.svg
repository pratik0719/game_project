<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2408"/>
      <stop offset="0.5" stop-color="#3d1030"/>
      <stop offset="1" stop-color="#180a3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#ffb703" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffb703" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1f3d"/>
      <stop offset="1" stop-color="#150e26"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="320" cy="130" r="210" fill="url(#glow)" filter="url(#soft)"/>

  <rect x="60" y="52" width="420" height="112" rx="18" fill="#1c1233" stroke="#ffb703" stroke-opacity="0.75" stroke-width="3"/>
  <path d="M 360 164 L 356 200 L 394 164 Z" fill="#1c1233" stroke="#ffb703" stroke-opacity="0.75" stroke-width="3"/>
  <text x="86" y="106" font-family="Arial, sans-serif" font-size="21" fill="#ffd97a" font-weight="bold">Which planet is known</text>
  <text x="86" y="138" font-family="Arial, sans-serif" font-size="21" fill="#ffd97a" font-weight="bold">as the Red Planet?</text>

  <g>
    <rect x="60" y="222" width="240" height="52" rx="13" fill="url(#chip)" stroke="#3b2b55" stroke-width="2"/>
    <text x="78" y="254" font-family="Arial, sans-serif" font-size="19" fill="#e6d9ff">A. Jupiter</text>
    <rect x="60" y="284" width="240" height="52" rx="13" fill="url(#chip)" stroke="#ff4d6d" stroke-width="3"/>
    <circle cx="358" cy="310" r="13" fill="#ff4d6d"/>
    <path d="M 353 310 L 358 315 L 366 304" stroke="#ffffff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="316" font-family="Arial, sans-serif" font-size="19" fill="#ffffff" font-weight="bold">B. Mars</text>
  </g>
  <g>
    <rect x="330" y="222" width="250" height="52" rx="13" fill="url(#chip)" stroke="#3b2b55" stroke-width="2"/>
    <text x="348" y="254" font-family="Arial, sans-serif" font-size="19" fill="#e6d9ff">C. Venus</text>
    <rect x="330" y="284" width="250" height="52" rx="13" fill="url(#chip)" stroke="#3b2b55" stroke-width="2"/>
    <text x="348" y="316" font-family="Arial, sans-serif" font-size="19" fill="#e6d9ff">D. Saturn</text>
  </g>

  <rect x="60" y="36" width="220" height="9" rx="5" fill="#3a2a12"/>
  <rect x="60" y="36" width="150" height="9" rx="5" fill="#ffb703"/>

  <circle cx="556" cy="80" r="30" fill="#ffb703" opacity="0.18"/>
  <text x="556" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#ffd97a" font-weight="bold">?</text>
  <circle cx="556" cy="80" r="38" fill="none" stroke="#ffb703" stroke-opacity="0.35" stroke-width="3"/>

  <rect x="0" y="0" width="640" height="360" fill="none" stroke="#ffb703" stroke-opacity="0.35" stroke-width="2" rx="18"/>
</svg>
