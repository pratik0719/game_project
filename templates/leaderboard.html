<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title><%= platformName %> | Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg" />
  <link rel="stylesheet" href="/static/css/styles.css" />
  <script defer src="/static/js/main.js"></script>
</head>
<body class="page-leaderboard" data-page="leaderboard" data-games="<%= games.map((game) => game.name).join(',') %>">
  <header class="site-header">
    <div class="brand-wrap">
      <img class="brand-logo" src="/static/icons/logo.svg" alt="" width="34" height="34" />
      <h1><%= platformName %></h1>
    </div>
    <nav class="top-nav">
      <a class="btn btn-outline" href="/">Home</a>
    </nav>
  </header>

  <main class="leaderboard-layout">
    <section class="card-surface" style="padding: 1rem;">
      <h2>Top 5 Scores Per Game</h2>
      <div id="leaderboard-root" class="leaderboard-grid"></div>
    </section>
  </main>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>
</body>
</html>
